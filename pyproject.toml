[project]
name = "scribe"
version = "0.1.0"
description = "Default template for PDM package"
authors = [{ name = "Elio Nakhle", email = "elio.nakhle@agile-robots.com" }]
dependencies = [
    "av>=15.0.0",  # 15+ has prebuilt wheels; 14.x fails to build against FFmpeg 6+
    "faster-whisper>=1.1.1",
    "typer>=0.16.0",
    "sox>=1.4.0",
    "ollama>=0.4.0",
    "pyannote-audio>=3.1.0",
    "vaderSentiment>=3.3.2",
    "Resemblyzer>=0.1.4",
    "scikit-learn>=1.0.0",
]
requires-python = ">=3.10,<3.14"
readme = "README.md"
license = { text = "MIT" }

[build-system]
requires = ["pdm-backend"]
build-backend = "pdm.backend"


[tool.pdm]
distribution = true

[tool.pdm.scripts]
meet = "python src/scribe/meet.py"
record = "python -m scribe.audio_utils"
summary = "python src/scribe/summary.py"
ollama = "python scripts/start_ollama.py"
